<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf8f5" />
<title>Amine Fellah</title>
<meta name="description" content="Amine Fellah." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="no-scroll">

  <!-- ============ PRELOADER ============ -->
  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <div class="preloader-logo">AF</div>
      <div class="preloader-line"><span class="preloader-line-fill" id="preloaderFill"></span></div>
    </div>
  </div>

  <!-- ============ CUSTOM CURSOR (desktop only) ============ -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="page">
    <div class="card-wrapper">

      <!-- PROFILE -->
      <section class="profile" data-reveal>
        <div class="avatar">
          <span class="avatar-initials">AF</span>
        </div>

        <h1 class="name">Amine <em>Fellah</em></h1>

        <blockquote class="quote">
          <span class="qmark">“</span>The person I am no one knows — the person everyone knows I am not.<span class="qmark">”</span>
        </blockquote>

        <div class="action-row">
          <a href="mailto:hello@aminefellah.dev" class="btn-primary magnetic" data-magnetic>
            <span>Email Me</span>
          </a>
          <a href="https://instagram.com/2050_fh1" target="_blank" rel="noopener noreferrer" class="btn-outline magnetic" data-magnetic aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
              <circle cx="12" cy="12" r="4.2"/>
              <circle cx="17.6" cy="6.4" r="0.5" fill="currentColor" stroke="none"/>
            </svg>
          </a>
        </div>
      </section>

      <div class="divider" data-reveal></div>

      <!-- LIFESTYLE -->
      <section class="block" data-reveal>
        <div class="block-label">
          <span class="label-line"></span>
          <span>Lifestyle</span>
          <span class="label-line"></span>
        </div>

        <div class="grid">

          <article class="grid-card">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="6.2" r="2"/>
                <path d="M9.5 11.5h5l1 6H8.5l1-6z"/>
                <path d="M7.5 20.5h9"/>
                <path d="M10 11.5c0-1.5 1-2.5 2-2.5s2 1 2 2.5"/>
              </svg>
            </span>
            <span class="card-title">Chess</span>
          </article>

          <article class="grid-card card-metric">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="15.5" cy="5" r="1.6"/>
                <path d="M12.5 21l1.6-6.2-2.4-2.2.9-4.4"/>
                <path d="M9.5 21l2.6-4.6"/>
                <path d="M8 10.5l4.6-1.3 2.4 2.5 3-1"/>
              </svg>
            </span>
            <div class="metric-wrap">
              <span class="metric-number" data-target="58.55">0.00</span>
              <span class="metric-unit">VO₂ Max · ml/kg/min</span>
            </div>
            <span class="card-title">Running</span>
          </article>

          <article class="grid-card">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12h16"/>
                <path d="M6 8.5v7"/>
                <path d="M18 8.5v7"/>
                <path d="M3 9.5v5"/>
                <path d="M21 9.5v5"/>
              </svg>
            </span>
            <span class="card-title">Powerlifting</span>
          </article>

          <article class="grid-card">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 13.5V8a3 3 0 0 1 6 0"/>
                <path d="M13 8a2.2 2.2 0 0 1 4.4 0v6.2a4.6 4.6 0 0 1-4.6 4.6h-1.3a4.6 4.6 0 0 1-3.9-2.1L6 13.8"/>
                <path d="M17.4 10.2a2 2 0 0 1 3.6 1.2v1.4"/>
              </svg>
            </span>
            <span class="card-title">Kickboxing</span>
          </article>

        </div>
      </section>

      <div class="divider" data-reveal></div>

      <!-- FOOTER -->
      <footer class="footer" data-reveal>
        <a href="https://instagram.com/2050_fh1" target="_blank" rel="noopener noreferrer" class="footer-link">
          <span>Instagram</span>
          <span class="footer-handle">@2050_fh1</span>
        </a>
        <p class="copyright">© 2026 Amine Fellah</p>
      </footer>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
